<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="Key Batch Operations">密钥批量操作</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card connection-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">MYSQL</p>
            <h2 data-i18n="Database connection">数据库连接</h2>
          </div>
          <span id="connectionStatus" class="status-pill" data-i18n="Disconnected">未连接</span>
        </div>

        <div class="form-grid profile-row">
          <label>
            <span data-i18n="Profile">配置档</span>
            <select id="profileSelect">
              <option value="" data-i18n="New profile">新建配置档</option>
            </select>
          </label>
          <label>
            <span data-i18n="Profile name">配置档名称</span>
            <input id="profileName" autocomplete="off" placeholder="例如：生产数据库" data-i18n-placeholder="For example: Production database" />
          </label>
        </div>

        <div class="form-grid connection-grid">
          <label>
            <span>Host</span>
            <input id="dbHost" autocomplete="off" value="localhost" />
          </label>
          <label>
            <span>Port</span>
            <input id="dbPort" type="number" min="1" max="65535" value="3306" />
          </label>
          <label>
            <span data-i18n="Database">数据库</span>
            <input id="dbName" autocomplete="off" value="new-api" />
          </label>
          <label>
            <span data-i18n="Username">用户名</span>
            <input id="dbUser" autocomplete="username" value="root" />
          </label>
          <label>
            <span>TLS</span>
            <select id="dbTlsMode">
              <option value="verify_identity" selected data-i18n="Verify certificate and hostname (recommended)">验证证书与主机名（推荐）</option>
              <option value="verify_ca" data-i18n="Verify certificate">验证证书</option>
              <option value="required" data-i18n="Require encryption">必须加密</option>
              <option value="preferred" data-i18n="Prefer encryption (allow fallback)">优先加密（可回退）</option>
              <option value="disabled" data-i18n="Disable TLS">禁用 TLS</option>
            </select>
          </label>
          <label class="password-label">
            <span data-i18n="Password">密码</span>
            <div class="secret-field">
              <input id="dbPassword" type="password" autocomplete="off" />
              <button id="togglePassword" class="field-action" type="button" data-i18n="Show">显示</button>
            </div>
          </label>
        </div>

        <div class="actions">
          <button id="connectButton" class="primary" type="button" data-i18n="Connect database">连接数据库</button>
          <button id="saveProfile" type="button" data-i18n="Save profile">保存配置档</button>
          <button id="deleteProfile" class="danger" type="button" data-i18n="Delete profile">删除配置档</button>
        </div>
      </section>

      <nav class="tabs" aria-label="功能切换" data-i18n-aria-label="Tools">
        <button class="tab-button active" data-tab="batch" type="button" data-i18n="Batch operations">批量操作</button>
        <button class="tab-button" data-tab="stats" type="button" data-i18n="Log statistics">日志统计</button>
      </nav>

      <section id="batchPanel" class="tab-panel active">
        <section class="card">
          <div class="card-heading compact-heading">
            <div>
              <p class="eyebrow">TOKENS</p>
              <h2 data-i18n="Group selection">分组选择</h2>
            </div>
            <button id="refreshGroups" type="button" disabled data-i18n="Refresh groups">刷新分组</button>
          </div>
          <div class="form-grid group-grid">
            <label>
              <span data-i18n="Group name">分组名</span>
              <input id="tokenGroup" list="groupOptions" value="default" autocomplete="off" />
              <datalist id="groupOptions"></datalist>
            </label>
            <div class="info-box">
              <span data-i18n="Current group">当前分组</span>
              <strong id="groupInfo" data-i18n="Connect to view token count">连接数据库后查看 Token 数量</strong>
            </div>
          </div>
        </section>

        <section class="card operation-card">
          <div class="card-heading">
            <div>
              <p class="eyebrow">BATCH</p>
              <h2 data-i18n="Operation mode">操作模式</h2>
            </div>
          </div>

          <div class="choice-row" id="operationModes">
            <button class="choice active" data-mode="extend-time" type="button" data-i18n="Extend token expiry">延长Token过期时间</button>
            <button class="choice" data-mode="add-quota" type="button" data-i18n="Add token quota">增加Token额度</button>
            <button class="choice" data-mode="deduct-time" type="button" data-i18n="Deduct token expiry">扣除Token过期时间</button>
            <button class="choice" data-mode="deduct-quota" type="button" data-i18n="Deduct token quota">扣除Token额度</button>
          </div>

          <div class="form-grid operation-grid">
            <label class="time-input">
              <span data-i18n="Days">天</span>
              <input id="days" type="number" min="0" value="30" />
            </label>
            <label class="time-input">
              <span data-i18n="Hours">时</span>
              <input id="hours" type="number" min="0" value="0" />
            </label>
            <label class="time-input">
              <span data-i18n="Minutes">分</span>
              <input id="minutes" type="number" min="0" value="0" />
            </label>
            <label class="quota-input">
              <span data-i18n="Quota in USD">美元额度</span>
              <input id="dollars" type="number" min="0" step="0.01" value="10" disabled />
            </label>
          </div>

          <div class="filter-row">
            <label class="check-field">
              <input id="usedOnly" type="checkbox" />
              <span data-i18n="Only keys that have been used">仅操作使用过的密钥</span>
            </label>
            <label class="check-field">
              <input id="minEnabled" type="checkbox" />
              <span data-i18n="Only keys with remaining quota above">仅操作剩余额度大于</span>
            </label>
            <label class="inline-input">
              <input id="minUsd" type="number" min="0" step="0.01" value="0" disabled />
              <span data-i18n="USD">美元</span>
            </label>
            <button id="executeBatch" class="primary" type="button" disabled data-i18n="Execute">执行操作</button>
          </div>
        </section>

        <section class="card result-card">
          <div class="card-heading compact-heading">
            <div>
              <p class="eyebrow">RESULTS</p>
              <h2 data-i18n="Operation results">操作结果</h2>
            </div>
            <button id="clearOperationLog" type="button" data-i18n="Clear">清空</button>
          </div>
          <div id="operationLog" class="operation-log">
            <p class="empty-message" data-i18n="No operation records">暂无操作记录</p>
          </div>
        </section>
      </section>

      <section id="statsPanel" class="tab-panel">
        <section class="card">
          <div class="card-heading">
            <div>
              <p class="eyebrow">STATISTICS</p>
              <h2 data-i18n="Query parameters">查询参数</h2>
            </div>
            <button id="queryStats" class="primary" type="button" disabled data-i18n="Query statistics">查询统计</button>
          </div>

          <div class="choice-row date-modes">
            <button class="choice active" data-date-mode="date" type="button" data-i18n="Specific date">指定日期</button>
            <button class="choice" data-date-mode="recent" type="button" data-i18n="Recent N days">最近N天</button>
          </div>

          <div class="form-grid stats-filter-grid">
            <label id="dateField">
              <span data-i18n="Date">日期</span>
              <input id="statsDate" type="date" />
            </label>
            <label id="recentDaysField" class="hidden">
              <span data-i18n="Recent days">最近天数</span>
              <input id="recentDays" type="number" min="1" value="7" />
            </label>
            <label>
              <span>Top N</span>
              <input id="topN" type="number" min="1" max="1000" value="10" />
            </label>
            <label>
              <span data-i18n="Group by">分组</span>
              <select id="groupBy">
                <option value="token_name">token_name</option>
                <option value="model_name">model_name</option>
                <option value="username">username</option>
                <option value="channel_name">channel_name</option>
                <option value="user_id">user_id</option>
              </select>
            </label>
            <label>
              <span data-i18n="Sort by">排序</span>
              <select id="sortBy">
                <option value="count">count</option>
                <option value="prompt_tokens">prompt_tokens</option>
                <option value="completion_tokens">completion_tokens</option>
                <option value="quota">quota</option>
              </select>
            </label>
            <label>
              <span data-i18n="Model filter">模型筛选</span>
              <input id="modelFilter" autocomplete="off" placeholder="支持模糊匹配" data-i18n-placeholder="Fuzzy matching supported" />
            </label>
            <label>
              <span data-i18n="Minimum tokens">最小Token</span>
              <input id="minTokens" type="number" min="1" value="1" />
            </label>
            <label>
              <span data-i18n="Exclude user ID">排除用户ID</span>
              <input id="excludeUserId" type="number" value="1" />
            </label>
            <label>
              <span data-i18n="Specific user ID">指定用户ID</span>
              <input id="userId" type="number" placeholder="填写后忽略排除条件" data-i18n-placeholder="Overrides excluded user when set" />
            </label>
          </div>
        </section>

        <section class="stats" aria-label="日志统计汇总" data-i18n-aria-label="Statistics summary">
          <article class="stat-card">
            <span data-i18n="Results">结果数</span>
            <strong id="resultCount">0</strong>
          </article>
          <article class="stat-card">
            <span data-i18n="Requests">请求次数</span>
            <strong id="totalRequests">0</strong>
          </article>
          <article class="stat-card">
            <span data-i18n="Prompt tokens">输入Token</span>
            <strong id="totalPrompt">0</strong>
          </article>
          <article class="stat-card">
            <span data-i18n="Completion tokens">输出Token</span>
            <strong id="totalCompletion">0</strong>
          </article>
          <article class="stat-card">
            <span data-i18n="Quota">配额</span>
            <strong id="totalQuota">$0.0000</strong>
          </article>
        </section>

        <section class="card stats-results-card">
          <div class="card-heading compact-heading">
            <div>
              <p class="eyebrow">RESULTS</p>
              <h2 data-i18n="Statistics results">统计结果</h2>
            </div>
            <button id="exportStatsCsv" type="button" disabled data-i18n="Export CSV">导出 CSV</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="Name">名称</th>
                  <th data-i18n="Requests">请求次数</th>
                  <th data-i18n="Prompt tokens">输入Token</th>
                  <th data-i18n="Completion tokens">输出Token</th>
                  <th data-i18n="Quota (USD)">配额(USD)</th>
                  <th data-i18n="Unique users">独立用户数</th>
                </tr>
              </thead>
              <tbody id="statsRows">
                <tr><td class="empty" colspan="6" data-i18n="Connect to query statistics">连接数据库后查询日志统计</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="../tauri-bridge.js"></script>
    <script src="../i18n.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
