<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>密钥查询</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card query-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">QUERY</p>
            <h2>查询条件</h2>
          </div>
          <span id="queryStatus" class="status-pill">等待查询</span>
        </div>

        <div class="form-grid profile-row">
          <label>
            <span>常用组合</span>
            <select id="profileSelect">
              <option value="">新建组合</option>
            </select>
          </label>
          <label>
            <span>组合名称</span>
            <input id="profileName" autocomplete="off" placeholder="例如：主站个人密钥" />
          </label>
        </div>

        <div class="form-grid">
          <label>
            <span>服务器地址</span>
            <input id="baseUrl" autocomplete="url" placeholder="https://api.example.com" />
          </label>
          <label>
            <span>密钥</span>
            <div class="secret-field">
              <input
                id="apiKey"
                type="password"
                autocomplete="off"
                placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx"
              />
              <button id="toggleSecret" class="field-action" type="button">显示</button>
            </div>
          </label>
        </div>

        <div class="actions">
          <button id="queryButton" class="primary" type="button">查询</button>
          <button id="saveProfile" type="button">保存组合</button>
          <button id="deleteProfile" class="danger" type="button">删除组合</button>
          <button id="copyInfo" type="button" disabled>复制信息</button>
        </div>
      </section>

      <section class="stats" aria-label="密钥统计">
        <article class="stat-card">
          <span>令牌名称</span>
          <strong id="tokenName">--</strong>
        </article>
        <article class="stat-card">
          <span>总额度</span>
          <strong id="balance">--</strong>
        </article>
        <article class="stat-card">
          <span>已使用</span>
          <strong id="usage">--</strong>
        </article>
        <article class="stat-card">
          <span>剩余额度</span>
          <strong id="remaining">--</strong>
        </article>
        <article class="stat-card">
          <span>有效期</span>
          <strong id="accessUntil">--</strong>
        </article>
      </section>

      <section class="card logs-card">
        <div class="card-heading logs-heading">
          <div>
            <p class="eyebrow">DETAILS</p>
            <h2>调用详情</h2>
          </div>
          <div class="table-actions">
            <label class="page-size">
              <span>每页</span>
              <select id="pageSize">
                <option>10</option>
                <option>20</option>
                <option>50</option>
                <option>100</option>
              </select>
            </label>
            <button id="exportCsv" type="button" disabled>导出 CSV</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>令牌名称</th>
                <th>分组</th>
                <th>模型</th>
                <th>用时</th>
                <th>流式</th>
                <th>提示</th>
                <th>补全</th>
                <th>花费</th>
                <th>倍率</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody id="logRows">
              <tr>
                <td class="empty" colspan="11">输入服务器和密钥开始查询</td>
              </tr>
            </tbody>
          </table>
        </div>

        <footer class="pagination">
          <span id="pageSummary">共 0 条</span>
          <div>
            <button id="previousPage" type="button" disabled>上一页</button>
            <span id="pageIndicator">1 / 1</span>
            <button id="nextPage" type="button" disabled>下一页</button>
          </div>
        </footer>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="../tauri-bridge.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
